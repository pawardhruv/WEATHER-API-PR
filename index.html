<!DOCTYPE html>
<html>
<head>
    <title>Weather App</title>
    <style>
        body { font-family: sans-serif; background-color: #2c3e50; color: white; text-align: center; padding-top: 50px; }
        .container { background: #34495e; padding: 30px; border-radius: 10px; display: inline-block; width: 300px; }
        input { padding: 8px; border-radius: 4px; border: none; width: 80%; }
        button { margin-top: 15px; padding: 8px 20px; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 4px; }
        #info-box { margin-top: 25px; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Check Weather</h2>
        <input type="text" id="cityName" placeholder="Type city...">
        <br>
        <button onclick="findWeather()">Search</button>
        <div id="info-box">---</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
